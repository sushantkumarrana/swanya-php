<svg class="diagram__svg" viewBox="0 0 1028 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wfi4-t wfi4-d">
<title id="wfi4-t">Water For Injection (WFI) System</title><desc id="wfi4-d">Purified water, pure steam and raw steam feed the multi-column distillation still and condenser; WFI is stored at 80 °C and above with a vent filter, circulated through the WFI loop, and sampled for conductivity, pH, pyrogen and microbial limit tests.</desc>
<style>/* ==========================================================================
   Water-system diagrams (SVG built by js/diagram.js)
   ========================================================================== */
.diagram{position:relative;width:100%}
.diagram__svg{width:100%;height:auto;display:block;overflow:visible;font-family:Inter,system-ui,sans-serif}
.diagram__edge{fill:none;stroke:#8FB3CC;stroke-width:2;color:#8FB3CC;stroke-linejoin:round;stroke-linecap:round}
.diagram__drop{filter:drop-shadow(0 1px 2px rgba(11,120,194,.35))}
.diagram__pump circle{fill:#fff;stroke:#7A9AB5;stroke-width:1.5}
