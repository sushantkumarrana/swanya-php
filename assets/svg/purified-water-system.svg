<svg class="diagram__svg" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="purified3-t purified3-d">
<title id="purified3-t">Purified Water System</title><desc id="purified3-d">Nine-stage purified water treatment: feed water passes through ozone treatment, UV, multigrade filtration, softening, reverse osmosis, electrodeionisation and a final UV stage before storage as Purified Water.</desc>
<style>/* ==========================================================================
   Water-system diagrams (SVG built by js/diagram.js)
