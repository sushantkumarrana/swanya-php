.diagram__node{cursor:help;transition:filter .35s,transform .35s ease}
.diagram__node rect{stroke:#8FB3CC;stroke-width:1.2;transition:stroke .35s,filter .35s}
.diagram__node--tank rect{stroke:#C9B48E}
.diagram__node:hover rect,.diagram__node:focus-visible rect{stroke:#0B78C2;filter:drop-shadow(0 8px 16px rgba(11,120,194,.28))}
.diagram__node:focus-visible{outline:none}
.diagram__node:focus-visible rect{stroke-width:2.2}
.diagram__icon{color:#0A5A96}
.diagram__node--tank .diagram__icon{color:#8A6A2E}
.diagram__label{font-family:Sora,system-ui,sans-serif;font-weight:600;fill:#0A2440}
.diagram__sub{fill:#4A6072;font-family:ui-monospace,monospace}
.diagram__legend text{fill:#4A6072;font-family:ui-monospace,monospace;letter-spacing:.02em}
.diagram__legend rect{stroke:#8FB3CC}
.diagram__lg-tank{stroke:#C9B48E!important}
.diagram__lg-pump{fill:#fff;stroke:#7A9AB5;stroke-width:1.5;color:#1B3A5C}
.diagram__tip{position:absolute;z-index:5;transform:translate(-50%,-100%);max-width:260px;padding:10px 14px;font-size:13px;line-height:1.45;color:#0A2440;background:rgba(255,255,255,.88);border-radius:12px;pointer-events:none;box-shadow:var(--shadow-md)}
.diagram__tip.is-below{transform:translate(-50%,0)}
/* Dark surfaces (navy band on home) */
.diagram--dark .diagram__edge{stroke:rgba(143,214,242,.55);color:rgba(143,214,242,.55)}
.diagram--dark .diagram__label{fill:#0A2440}
.diagram--dark .diagram__legend text{fill:rgba(255,255,255,.7)}
/* No-JS fallback list */
.diagram__steps{display:grid;gap:8px;counter-reset:s}
.diagram__steps li{display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;color:#0A2440}
.diagram__steps li::before{counter-increment:s;content:counter(s);font-family:ui-monospace,monospace;font-size:11px;color:#0B78C2;width:22px;height:22px;border-radius:50%;background:var(--bg-cool);display:grid;place-items:center;flex:none}
.js .diagram.is-ready .diagram__steps{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
